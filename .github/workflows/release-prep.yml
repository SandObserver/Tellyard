name: Release prep

on:
  workflow_dispatch:
    inputs:
      note:
        description: Extra changelog line for this release, if any
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Mint a token for the release app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the release pull request
        env:
          NOTE: ${{ inputs.note }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          published=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if ! grep -qE "^## \[${published#v}\] - " CHANGELOG.md; then
            echo "::error::$published is published but not recorded on main yet. Merge its Release pull request first."
            exit 1
          fi
          highest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          version=$(python3 tools/release.py prepare --note "$NOTE" --above "${highest#v}")
          python3 tools/unraid_template.py
          uv lock
          branch="release/v$version"
          git config user.name 'SandObserver'
          git config user.email '260779319+SandObserver@users.noreply.github.com'
          git checkout -b "$branch"
          git add pyproject.toml uv.lock CHANGELOG.md templates/tellyard.xml
          git commit -m "Release $version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "Release: $version" \
            --body "$(printf '%s\n' '## Summary' "- Date the Unreleased changes as $version and bump the version." '' '## Testing' 'CI runs on this pull request. Merging it tags v'"$version"' and publishes the image.')"
          gh pr merge --auto --squash "$branch"
