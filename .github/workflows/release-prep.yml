name: Release prep

on:
  push:
    branches: [main]
    paths: [uv.lock]
  workflow_dispatch:
    inputs:
      note:
        description: Extra changelog line for this release, if any
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Decide whether yt-dlp changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "note=$INPUT_NOTE" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD~1:uv.lock > "$RUNNER_TEMP/old.lock"
          note=$(python3 tools/release.py note "$RUNNER_TEMP/old.lock" uv.lock)
          echo "note=$note" >> "$GITHUB_OUTPUT"
          if [ -n "$note" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
      - name: Mint a token for the release app
        if: steps.decide.outputs.release == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the release pull request
        if: steps.decide.outputs.release == 'true'
        env:
          NOTE: ${{ steps.decide.outputs.note }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          version=$(python3 tools/release.py prepare --note "$NOTE")
          python3 tools/unraid_template.py
          uv lock
          branch="release/v$version"
          git config user.name 'SandObserver'
          git config user.email '260779319+SandObserver@users.noreply.github.com'
          git checkout -b "$branch"
          git add pyproject.toml uv.lock CHANGELOG.md templates/tellyard.xml
          git commit -m "Release $version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "Release: $version" \
            --body "$(printf '%s\n' '## Summary' "- Date the Unreleased changes as $version and bump the version." '' '## Testing' 'CI runs on this pull request. Merging it tags v'"$version"' and publishes the image.')"
          gh pr merge --auto --squash "$branch"
