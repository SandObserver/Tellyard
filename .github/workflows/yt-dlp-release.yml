name: yt-dlp release

on:
  schedule:
    - cron: "23 */6 * * *"
  # Only tag pushes start Release. This run reads nothing from it.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and record without pushing a tag or a branch
        type: boolean
        default: true

# Pushes and pull requests use the app token. A GITHUB_TOKEN push starts no workflow.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse other branches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Record the newest published release on main
        id: record
        run: |
          set -euo pipefail
          published=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          echo "published=$published" >> "$GITHUB_OUTPUT"
          git show "$published:CHANGELOG.md" > "$RUNNER_TEMP/released.md"
          git show "$published:uv.lock" > "$RUNNER_TEMP/released.lock"
          if git ls-remote --exit-code --heads origin "record/$published" >/dev/null; then
            echo "The pull request that records $published is still open."
            echo "pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          recorded=$(python3 tools/release.py record --version "${published#v}" --released "$RUNNER_TEMP/released.md")
          if [ "$recorded" != true ]; then
            echo "$published is recorded on main."
            exit 0
          fi
          pins=$(python3 tools/release.py pins "$RUNNER_TEMP/released.lock")
          upgrades=()
          while read -r pin; do upgrades+=(--upgrade-package "$pin"); done <<< "$pins"
          uv lock "${upgrades[@]}"
          different=$(python3 tools/release.py note "$RUNNER_TEMP/released.lock" uv.lock)
          if [ -n "$different" ]; then
            echo "::error::main cannot lock the yt-dlp versions of $published."
            exit 1
          fi
          python3 tools/unraid_template.py
          git config user.name 'SandObserver'
          git config user.email '260779319+SandObserver@users.noreply.github.com'
          git switch -c "record/$published"
          git add pyproject.toml uv.lock CHANGELOG.md templates/tellyard.xml
          git commit -m "Release ${published#v}"
          git show --stat HEAD
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "open=true" >> "$GITHUB_OUTPUT"
      - name: Build a release on top of the newest published release
        id: build
        if: github.event_name != 'workflow_run' && steps.record.outputs.pending != 'true'
        env:
          PUBLISHED: ${{ steps.record.outputs.published }}
        run: |
          set -euo pipefail
          tools="$PWD/tools"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag="v$(echo "$version" | sed -E 's/b([0-9]+)$/-beta.\1/')"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "main is at $version, which is not tagged yet. Waiting for that release."
            exit 0
          fi
          open=$(gh pr list --repo "$REPO" --state open --json headRefName --jq '.[].headRefName')
          if grep -q '^release/' <<< "$open"; then
            echo "A release pull request is open. Waiting for it."
            exit 0
          fi
          highest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "$highest" != "$PUBLISHED" ]; then
            state=$(gh run list --repo "$REPO" --workflow release.yml --branch "$highest" --limit 1 --json status --jq '.[0].status')
            if [ "$state" != completed ]; then
              echo "The release of $highest is not finished. Waiting for it."
              exit 0
            fi
          fi
          ready=$(python3 "$tools/release.py" ready "$RUNNER_TEMP/released.lock")
          if [ "$ready" != true ]; then
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/release" "$PUBLISHED"
          cd "$RUNNER_TEMP/release"
          uv lock --upgrade-package yt-dlp --upgrade-package yt-dlp-ejs
          note=$(python3 "$tools/release.py" note "$RUNNER_TEMP/released.lock" uv.lock)
          if [ -z "$note" ]; then
            echo "$PUBLISHED already has the newest yt-dlp."
            exit 0
          fi
          if [ "$highest" != "$PUBLISHED" ]; then
            git show "$highest:uv.lock" > "$RUNNER_TEMP/highest.lock"
            newer=$(python3 "$tools/release.py" note "$RUNNER_TEMP/highest.lock" uv.lock)
            if [ -z "$newer" ]; then
              echo "::warning::$highest has this yt-dlp but was not published. Check its Release run."
              exit 0
            fi
          fi
          python3 "$tools/release.py" verify uv.lock
          version=$(python3 "$tools/release.py" prepare --note "$note" --above "${highest#v}")
          python3 tools/unraid_template.py
          uv lock
          git config user.name 'SandObserver'
          git config user.email '260779319+SandObserver@users.noreply.github.com'
          git add pyproject.toml uv.lock CHANGELOG.md templates/tellyard.xml
          git commit -m "Release $version"
          git tag -a "v$version" -m "Release $version"
          git show --stat HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Mint a token for the release app
        if: (steps.record.outputs.open == 'true' || steps.build.outputs.version) && !inputs.dry-run
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request that records the release on main
        if: steps.record.outputs.open == 'true' && !inputs.dry-run
        env:
          PUBLISHED: ${{ steps.record.outputs.published }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/record/$PUBLISHED"
          gh pr create --base main --head "record/$PUBLISHED" --title "Release: ${PUBLISHED#v}" \
            --body "$(printf '%s\n' '## Summary' "- Record the published ${PUBLISHED#v} release on main: CHANGELOG section, yt-dlp in uv.lock and the Unraid template." '' '## Testing' "$PUBLISHED is published. CI runs on this pull request.")"
          gh pr merge --auto --squash "record/$PUBLISHED"
      - name: Push the tag
        if: steps.build.outputs.version && !inputs.dry-run
        env:
          VERSION: ${{ steps.build.outputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: git -C "$RUNNER_TEMP/release" push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/v$VERSION"
