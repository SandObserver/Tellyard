name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tellyard:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - run: docker run --rm tellyard:ci tellyard --version
      - run: docker run --rm --entrypoint sh tellyard:ci -c "ffmpeg -version | head -1 && deno --version | head -1"
      - name: Check the container becomes healthy
        run: |
          mkdir -p config
          cp channels.example.toml config/channels.toml
          docker run -d --name tellyard --read-only --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 --cap-drop ALL \
            -v "$PWD/config:/config:ro" tellyard:ci
          for _ in $(seq 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tellyard)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs tellyard
          test "$state" = healthy
      - name: Check the container starts as the Unraid template runs it
        run: |
          mkdir -p unraid/config unraid/data
          chmod 0777 unraid/config unraid/data
          env=()
          while read -r name; do env+=(-e "$name="); done < <(grep -o 'Target="[A-Z_]*"' templates/tellyard.xml | cut -d'"' -f2)
          docker run -d --name unraid --user 99:100 --init --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true "${env[@]}" \
            -v "$PWD/unraid/config:/config:ro" -v "$PWD/unraid/data:/data" tellyard:ci
          sleep 5
          docker exec unraid tellyard health 2>&1 | tee health.txt || true
          grep -q 'no channels yet' health.txt
          cp channels.example.toml unraid/config/channels.toml
          for _ in $(seq 20); do
            docker exec unraid tellyard health && ok=1 && break
            sleep 3
          done
          docker logs unraid
          test "${ok:-}" = 1
          docker rm -f unraid
      - name: Play a test stream through the image
        run: tests/e2e.sh tellyard:ci
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tellyard:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  image-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: tellyard:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - run: docker run --rm --platform linux/arm64 tellyard:arm64 tellyard --version
      - run: >-
          docker run --rm --platform linux/arm64 --entrypoint sh tellyard:arm64 -c
          "ffmpeg -version | head -1 && deno --version | head -1 && yt-dlp --version"
      - run: >-
          docker run --rm --platform linux/arm64 -e CHANNELS_FILE=/config/channels.example.toml tellyard:arm64
          tellyard validate
