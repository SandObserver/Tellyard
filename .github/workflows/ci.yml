name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tellyard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm tellyard:ci tellyard --version
      - run: docker run --rm --entrypoint sh tellyard:ci -c "ffmpeg -version | head -1 && deno --version | head -1"
      - name: Check the container becomes healthy
        run: |
          mkdir -p config
          cp channels.example.toml config/channels.toml
          docker run -d --name tellyard --read-only --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 --cap-drop ALL \
            -v "$PWD/config:/config:ro" tellyard:ci
          for _ in $(seq 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tellyard)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs tellyard
          test "$state" = healthy
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tellyard:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table
