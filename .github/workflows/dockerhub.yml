name: Docker Hub page

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/dockerhub_description.py > dockerhub.md
      - name: Check the token can push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: sandobserver
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The token needs Read, Write and Delete.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: sandobserver
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sandobserver/tellyard
          readme-filepath: dockerhub.md
          short-description: A live TV tuner for Plex and Jellyfin you'll forget is running. Streams only while someone watches.
