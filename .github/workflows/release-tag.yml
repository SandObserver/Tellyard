name: Release tag

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

# Use the app token. A GITHUB_TOKEN push starts no workflow.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this is a release
        id: decide
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag="v$(echo "$version" | sed -E 's/b([0-9]+)$/-beta.\1/')"
          if git ls-remote --exit-code --tags "https://github.com/${REPO}.git" "$tag" >/dev/null; then
            echo "$tag is already tagged."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "^## \[${tag#v}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::notice::pyproject.toml says $version, but CHANGELOG.md has no dated section for it. No tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Mint a token for the release app
        if: steps.decide.outputs.release == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Tag the release
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'SandObserver'
          git config user.email '260779319+SandObserver@users.noreply.github.com'
          git tag -a "$TAG" -m "Release ${TAG#v}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG"
