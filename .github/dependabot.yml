version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # YouTube changes break older yt-dlp releases quickly, so take its fixes at once.
      exclude: ["yt-dlp*"]
    groups:
      python:
        update-types: [minor, patch]
        exclude-patterns: ["yt-dlp*"]
      python-major:
        update-types: [major]
        exclude-patterns: ["yt-dlp*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        update-types: [minor, patch]
      site-major:
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The base image Python must match requires-python in pyproject.toml.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
