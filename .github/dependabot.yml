version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # YouTube changes break older yt-dlp releases quickly, so take its fixes at once.
      exclude: ["yt-dlp", "yt-dlp-ejs"]
    groups:
      python:
        update-types: [minor, patch]
        exclude-patterns: ["yt-dlp*"]
      python-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        update-types: [minor, patch]
      site-major:
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
